name: Build Chronoface

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write

    env:
      # When app-signing secrets are absent (PR from fork) we fall back to ad-hoc.
      HAS_APP_SIGNING: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.MACOS_DEVELOPER_ID != '' }}
      # PKG is built only when the installer cert is also configured.
      HAS_PKG_SIGNING: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.MACOS_DEVELOPER_ID != '' && secrets.MACOS_INSTALLER_CERTIFICATE != '' && secrets.MACOS_INSTALLER_ID != '' }}
      # Notarisation runs only for tagged releases AND when Apple-ID secrets exist.
      DO_NOTARIZE: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_ID != '' && secrets.APPLE_APP_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Import signing certificates
        if: env.HAS_APP_SIGNING == 'true'
        env:
          APP_CERT_B64: ${{ secrets.MACOS_CERTIFICATE }}
          APP_CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          INSTALLER_CERT_B64: ${{ secrets.MACOS_INSTALLER_CERTIFICATE }}
          INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -e
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          APP_CERT_PATH="$RUNNER_TEMP/app-cert.p12"
          echo "$APP_CERT_B64" | base64 --decode > "$APP_CERT_PATH"
          security import "$APP_CERT_PATH" \
            -P "$APP_CERT_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          rm -f "$APP_CERT_PATH"

          if [ -n "$INSTALLER_CERT_B64" ]; then
            INSTALLER_CERT_PATH="$RUNNER_TEMP/installer-cert.p12"
            echo "$INSTALLER_CERT_B64" | base64 --decode > "$INSTALLER_CERT_PATH"
            security import "$INSTALLER_CERT_PATH" \
              -P "$INSTALLER_CERT_PASSWORD" \
              -A -t cert -f pkcs12 \
              -k "$KEYCHAIN_PATH"
            rm -f "$INSTALLER_CERT_PATH"
          fi

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign:,productbuild: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | xargs)

      - name: Build ChronofaceApp (signed)
        if: env.HAS_APP_SIGNING == 'true'
        env:
          DEV_ID: ${{ secrets.MACOS_DEVELOPER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO - не добавлять get-task-allow.
          # Это Debug-only entitlement для debugger attach; Apple notary его отвергает.
          xcodebuild \
            -project Chronoface/Chronoface.xcodeproj \
            -scheme ChronofaceApp \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath Chronoface/build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$DEV_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            OTHER_CODE_SIGN_FLAGS="--timestamp --options=runtime" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$VERSION" \
            clean build

      - name: Sign Sparkle components with Developer ID
        if: env.HAS_APP_SIGNING == 'true'
        env:
          DEV_ID: ${{ secrets.MACOS_DEVELOPER_ID }}
        run: |
          set -e
          # xcodebuild signs the app and the framework bundle but leaves
          # Sparkle's nested helpers with the Sparkle project's own signature,
          # which notarization rejects (no Developer ID, no secure timestamp).
          # Re-sign inner to outer, then re-seal the app itself.
          APP="Chronoface/build/Build/Products/Release/Chronoface.app"
          FW="$APP/Contents/Frameworks/Sparkle.framework/Versions/B"
          for item in "$FW/XPCServices/Downloader.xpc" "$FW/XPCServices/Installer.xpc" "$FW/Updater.app" "$FW/Autoupdate"; do
            codesign --force --options runtime --timestamp --sign "$DEV_ID" "$item"
          done
          codesign --force --options runtime --timestamp --sign "$DEV_ID" "$APP/Contents/Frameworks/Sparkle.framework"
          codesign --force --options runtime --timestamp --sign "$DEV_ID" --preserve-metadata=identifier,entitlements,flags "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Build ChronofaceApp (ad-hoc)
        if: env.HAS_APP_SIGNING != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          xcodebuild \
            -project Chronoface/Chronoface.xcodeproj \
            -scheme ChronofaceApp \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath Chronoface/build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$VERSION" \
            clean build

      - name: Build legacy Chronoface.saver (signed)
        if: env.HAS_APP_SIGNING == 'true'
        env:
          DEV_ID: ${{ secrets.MACOS_DEVELOPER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          xcodebuild \
            -project Chronoface/Chronoface.xcodeproj \
            -target Chronoface \
            -configuration Release \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$DEV_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            OTHER_CODE_SIGN_FLAGS="--timestamp --options=runtime" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$VERSION" \
            CONFIGURATION_BUILD_DIR="$PWD/Chronoface/build/Build/Products/Release" \
            build

      - name: Build legacy Chronoface.saver (ad-hoc)
        if: env.HAS_APP_SIGNING != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          xcodebuild \
            -project Chronoface/Chronoface.xcodeproj \
            -target Chronoface \
            -configuration Release \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$VERSION" \
            CONFIGURATION_BUILD_DIR="$PWD/Chronoface/build/Build/Products/Release" \
            build

      - name: Notarize and staple .app
        if: env.DO_NOTARIZE == 'true' && env.HAS_APP_SIGNING == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -e
          APP_DIR="Chronoface/build/Build/Products/Release"
          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR/Chronoface.app" "$APP_DIR/Chronoface-notary.zip"

          SUBMIT_OUT=$(xcrun notarytool submit "$APP_DIR/Chronoface-notary.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --output-format json)
          echo "$SUBMIT_OUT"

          SUB_ID=$(echo "$SUBMIT_OUT"  | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          STATUS=$(echo "$SUBMIT_OUT" | python3 -c 'import sys,json;print(json.load(sys.stdin)["status"])')

          echo "::group::Notarization log .app ($SUB_ID, status=$STATUS)"
          xcrun notarytool log "$SUB_ID" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" || true
          echo "::endgroup::"

          if [ "$STATUS" != "Accepted" ]; then
            echo ".app notarization failed with status: $STATUS"
            exit 1
          fi

          xcrun stapler staple "$APP_DIR/Chronoface.app"
          rm -f "$APP_DIR/Chronoface-notary.zip"

      - name: Notarize and staple .saver
        if: env.DO_NOTARIZE == 'true' && env.HAS_APP_SIGNING == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -e
          APP_DIR="Chronoface/build/Build/Products/Release"
          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR/Chronoface.saver" "$APP_DIR/Chronoface-saver-notary.zip"

          SUBMIT_OUT=$(xcrun notarytool submit "$APP_DIR/Chronoface-saver-notary.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --output-format json)
          echo "$SUBMIT_OUT"

          SUB_ID=$(echo "$SUBMIT_OUT"  | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          STATUS=$(echo "$SUBMIT_OUT" | python3 -c 'import sys,json;print(json.load(sys.stdin)["status"])')

          echo "::group::Notarization log .saver ($SUB_ID, status=$STATUS)"
          xcrun notarytool log "$SUB_ID" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" || true
          echo "::endgroup::"

          if [ "$STATUS" != "Accepted" ]; then
            echo ".saver notarization failed with status: $STATUS"
            exit 1
          fi

          xcrun stapler staple "$APP_DIR/Chronoface.saver"
          rm -f "$APP_DIR/Chronoface-saver-notary.zip"

      - name: Build combined .pkg (App + Extension + legacy .saver)
        if: env.HAS_PKG_SIGNING == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APP_PATH: ${{ github.workspace }}/Chronoface/build/Build/Products/Release/Chronoface.app
          SAVER_PATH: ${{ github.workspace }}/Chronoface/build/Build/Products/Release/Chronoface.saver
        run: |
          set -e
          bash installer/build-pkg.sh "$VERSION"
          # build-pkg.sh produces dist/Chronoface-$VERSION.pkg (unsigned)
          mv "dist/Chronoface-${VERSION}.pkg" "dist/Chronoface-unsigned.pkg"

      - name: Sign .pkg
        if: env.HAS_PKG_SIGNING == 'true'
        env:
          INSTALLER_ID: ${{ secrets.MACOS_INSTALLER_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e
          productsign --sign "$INSTALLER_ID" \
            "dist/Chronoface-unsigned.pkg" \
            "dist/Chronoface-${VERSION}.pkg"
          rm -f "dist/Chronoface-unsigned.pkg"
          pkgutil --check-signature "dist/Chronoface-${VERSION}.pkg"
          # Keep a stable filename for upload step too
          cp "dist/Chronoface-${VERSION}.pkg" "dist/Chronoface.pkg"

      - name: Notarize and staple .pkg
        if: env.DO_NOTARIZE == 'true' && env.HAS_PKG_SIGNING == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e
          SUBMIT_OUT=$(xcrun notarytool submit "dist/Chronoface-${VERSION}.pkg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --output-format json)
          echo "$SUBMIT_OUT"

          SUB_ID=$(echo "$SUBMIT_OUT"  | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          STATUS=$(echo "$SUBMIT_OUT" | python3 -c 'import sys,json;print(json.load(sys.stdin)["status"])')

          echo "::group::Notarization log .pkg ($SUB_ID, status=$STATUS)"
          xcrun notarytool log "$SUB_ID" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" || true
          echo "::endgroup::"

          if [ "$STATUS" != "Accepted" ]; then
            echo "PKG notarization failed with status: $STATUS"
            exit 1
          fi

          xcrun stapler staple "dist/Chronoface-${VERSION}.pkg"
          cp "dist/Chronoface-${VERSION}.pkg" "dist/Chronoface.pkg"

      - name: Publish Sparkle feed to chronoface.perek.rest
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_PKG_SIGNING == 'true' && env.DO_NOTARIZE == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.GARAGE_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.GARAGE_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: garage
          # Garage 1.0.1 does not support the streaming checksum format newer
          # awscli sends by default (same workaround as the Jenkins deploy).
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          S3_ENDPOINT: https://s3.perek.rest
        run: |
          set -e
          # The feed serves the same notarized+stapled .pkg as the manual
          # install: Sparkle runs it as a guided package install, so app,
          # extension and legacy saver update together.
          PKG="dist/Chronoface-${VERSION}.pkg"

          # Sparkle CLI tools (sign_update); keep the version in sync with the SPM dependency
          curl -sSL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/2.9.6/Sparkle-2.9.6.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xJf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"

          KEY_FILE="$RUNNER_TEMP/sparkle_ed25519"
          printf '%s' "$SPARKLE_ED25519_PRIVATE_KEY" > "$KEY_FILE"
          SIG_LINE=$("$RUNNER_TEMP/sparkle/bin/sign_update" --ed-key-file "$KEY_FILE" "$PKG")
          rm -f "$KEY_FILE"
          echo "sign_update: $SIG_LINE"
          ED_SIG=$(echo "$SIG_LINE" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')
          LENGTH=$(echo "$SIG_LINE" | sed -n 's/.*length="\([^"]*\)".*/\1/p')
          test -n "$ED_SIG" && test -n "$LENGTH"

          # Current feed, or a skeleton on the very first release
          if ! curl -sSf -o appcast.xml "https://chronoface.perek.rest/appcast.xml"; then
            cat > appcast.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Chronoface</title>
              <link>https://chronoface.perek.rest/appcast.xml</link>
              <description>Chronoface updates</description>
              <language>en</language>
            </channel>
          </rss>
          XML
          fi

          python3 - "$VERSION" "$ED_SIG" "$LENGTH" <<'PY'
          import os, re, sys
          from datetime import datetime, timezone
          version, sig, length = sys.argv[1:4]
          with open("appcast.xml") as f:
              s = f.read()
          # A re-run of the same tag rebuilds the pkg byte-differently and
          # re-uploads it: replace the version's item instead of keeping a
          # signature of a file no longer served.
          item_re = re.compile(r"[ \t]*<item>.*?</item>\n", re.S)
          s = item_re.sub(lambda m: "" if f"<sparkle:shortVersionString>{version}<" in m.group(0) else m.group(0), s)
          pub = datetime.now(timezone.utc).strftime("%a, %d %b %Y %H:%M:%S +0000")
          # Optional release notes for Sparkle's update dialog: an HTML
          # fragment committed as release-notes/<version>.html.
          notes_path = f"release-notes/{version}.html"
          description = ""
          if os.path.exists(notes_path):
              with open(notes_path, encoding="utf-8") as f:
                  notes = f.read().strip().replace("]]>", "]]&gt;")
              description = f"\n      <description><![CDATA[\n{notes}\n      ]]></description>"
              print(f"release notes: {notes_path}")
          else:
              print(f"release notes: {notes_path} not found, the item goes without a description")
          # CFBundleVersion equals the marketing version in this project, so
          # sparkle:version carries the same dotted string.
          item = f"""    <item>
                <title>Version {version}</title>
                <pubDate>{pub}</pubDate>{description}
                <sparkle:version>{version}</sparkle:version>
                <sparkle:shortVersionString>{version}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>14.6</sparkle:minimumSystemVersion>
                <enclosure url="https://chronoface.perek.rest/downloads/Chronoface-{version}.pkg" length="{length}" type="application/octet-stream" sparkle:installationType="package" sparkle:edSignature="{sig}"/>
              </item>
          """
          item = "\n".join(line[10:] if line.startswith(" " * 10) else line for line in item.splitlines()) + "\n"
          s = s.replace("  </channel>", item + "  </channel>", 1)
          with open("appcast.xml", "w") as f:
              f.write(s)
          print(f"appcast now carries {version}")
          PY

          cat appcast.xml
          aws --endpoint-url "$S3_ENDPOINT" s3 cp "$PKG" "s3://chronoface/downloads/Chronoface-$VERSION.pkg"
          aws --endpoint-url "$S3_ENDPOINT" s3 cp "$PKG" "s3://chronoface/downloads/Chronoface-latest.pkg"
          aws --endpoint-url "$S3_ENDPOINT" s3 cp appcast.xml "s3://chronoface/appcast.xml" --content-type "application/xml"

      - name: Package legacy .saver as standalone zip
        run: |
          cd Chronoface/build/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent Chronoface.saver "$GITHUB_WORKSPACE/Chronoface.saver.zip"

      - name: Cleanup keychain
        if: always() && env.HAS_APP_SIGNING == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain" || true

      - name: Upload .pkg artifact
        if: env.HAS_PKG_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Chronoface.pkg
          path: dist/Chronoface.pkg

      - name: Upload .saver.zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chronoface.saver
          path: Chronoface.saver.zip

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Chronoface.pkg
            Chronoface.saver.zip
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            ## Installation

            **Recommended:** download `Chronoface.pkg`, double-click it and follow the installer steps.

            On **macOS 14 Sonoma and later** it installs the Chronoface app into Applications together with a screensaver extension. Open System Settings → Screen Saver → Chronoface.

            On **macOS 13 Ventura** it installs the legacy `.saver` into /Library/Screen Savers/.

            **Alternative:** unzip `Chronoface.saver.zip` and double-click it - legacy `.saver` only, without the app.

            ## Uninstall

            On macOS 14+: open the Chronoface app and choose **Chronoface → Uninstall Chronoface…** from the menu bar.

            On macOS 13: delete `/Library/Screen Savers/Chronoface.saver` in Finder.

            ---

            Signed with a Developer ID and notarized by Apple - Gatekeeper won't complain.